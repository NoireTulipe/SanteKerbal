// Réglages de SanteKerbal : modifiables sans recompiler (relancer KSP pour les appliquer).
// "jour" = un jour de jeu, 6 h ou 24 h selon le réglage du calendrier de KSP.
//
// Les principaux réglages (survie, récupération, consommation, G, chaleur, effets, outils de test)
// se règlent aussi PAR PARTIE dans le jeu : Paramètres de difficulté > onglet SantéKerbal.
// Ceux de la partie ont priorité ; les valeurs ci-dessous servent de préréglage « Normal »
// pour les nouvelles parties, et de valeurs pour tout ce qui n'est pas dans le menu.
SANTEKERBAL_SETTINGS
{
	// Consommation, en unités par Kerbal et par jour
	waterPerDay = 3
	foodPerDay = 1

	// Jours de survie sans eau / sans nourriture (la santé passe de 100 à 0 en ce temps)
	daysWithoutWater = 3
	daysWithoutFood = 21

	// Santé regagnée par jour quand tous les besoins sont couverts
	regenPerDay = 5

	// Accélérations : au-delà de highG pendant plus de highGGraceSeconds,
	// le Kerbal perd highGDamagePerSecond points par seconde.
	// Au-delà de lethalG pendant lethalGSeconds, il meurt.
	highG = 6
	highGGraceSeconds = 5
	highGDamagePerSecond = 2
	lethalG = 20
	lethalGSeconds = 1

	// Chaleur : au-delà de heatThreshold (Kelvin) dans sa pièce, le Kerbal perd
	// heatDamagePerSecondPerKelvin points par seconde et par degré au-dessus du seuil.
	heatThreshold = 330
	heatDamagePerSecondPerKelvin = 0.01

	// Dépérissement visible dans le portrait IVA.
	// Les effets commencent sous visualStartHealth et sont maximaux à santé nulle.
	visualStartHealth = 80
	minAnimationSpeed = 0.3     // vitesse des animations (1 = normale)
	maxHeadTilt = 25            // inclinaison de la tête en degrés, vivant à santé nulle
	deadHeadTilt = 55           // inclinaison de la tête d'un mort
	headTiltAxis = 1,0,0        // axe local de rotation de la tête (à ajuster si elle penche de côté)
	headBoneName = bn_neck01    // os qui penche (autres choix : bn_headPivot_a01, bn_headPivot_b01)
	paleColor = 0.85,0.85,0.8   // teinte vers laquelle le teint pâlit
	maxPaleness = 0.7           // 0 = pas de pâleur, 1 = entièrement blafard
	deadColor = 0.55,0.6,0.55   // teint d'un mort
	skinTextureKeywords = head,face  // mots-clés des textures de peau (voir KSP.log si rien ne pâlit)
	hideEyesWhenDead = true     // masque les yeux des morts (pour voir les orbites de Textures/<texture>_mort.png)
	deathView = body            // portrait d'un mort : body (dépouille visible), static (signal perdu),
	                            // ghost (signal fantôme : brouillé, la dépouille apparaît par instants)

	// Hibernation (caisson SK-H2)
	cryoEcPerSecond = 0.5            // électricité consommée par dormeur et par seconde
	cryoWakeHours = 2                // durée du réveil, en heures de jeu (le Kerbal ne peut pas encore piloter)
	cryoWakeDamage = 5               // santé perdue au réveil
	cryoUnpoweredDamagePerDay = 25   // santé perdue par jour quand le caisson manque d'électricité

	// Log de diagnostic dans KSP.log : état de chaque vaisseau chargé toutes les N secondes
	// réelles (0 = désactivé).
	debugLogInterval = 30

	// Boutons de test dans la fenêtre (-20, +20, Tuer). À désactiver pour jouer normalement.
	debugTools = true
}
