// Patches Module Manager de SanteKerbal.

// 1) Module de vie : clone du réservoir RCS FL-R120 (1,25 m), rempli d'eau et de nourriture.
//    300 eau + 100 nourriture = 100 jours-Kerbal avec les consommations par défaut.
+PART[RCSFuelTank]:FOR[SanteKerbal]
{
	@name = SanteKerbal_ModuleVie
	@title = Module de vie SK-100
	@manufacturer = NoireTulipe (c) Corporation
	@description = Réserve d'eau et de nourriture pour l'équipage. Contient de quoi faire vivre un Kerbal pendant 100 jours.
	@tags = santekerbal eau nourriture vie survie water food life support
	@category = Utility
	@TechRequired = start
	@entryCost = 0
	@cost = 250
	@mass = 0.08

	!RESOURCE[MonoPropellant] {}

	RESOURCE
	{
		name = SanteKerbal_Eau
		amount = 300
		maxAmount = 300
	}
	RESOURCE
	{
		name = SanteKerbal_Nourriture
		amount = 100
		maxAmount = 100
	}
}

// 2) Petite réserve dans toutes les pièces habitables : 2 jours par siège
//    (eau : 3/jour x 2 = 6 par siège ; nourriture : 1/jour x 2 = 2 par siège).
@PART[*]:HAS[#CrewCapacity[>0],!RESOURCE[SanteKerbal_Eau]]:FOR[SanteKerbal]
{
	RESOURCE
	{
		name = SanteKerbal_Eau
		amount = #$/CrewCapacity$
		@amount *= 6
		maxAmount = #$amount$
	}
}

@PART[*]:HAS[#CrewCapacity[>0],!RESOURCE[SanteKerbal_Nourriture]]:FOR[SanteKerbal]
{
	RESOURCE
	{
		name = SanteKerbal_Nourriture
		amount = #$/CrewCapacity$
		@amount *= 2
		maxAmount = #$amount$
	}
}

// 3) Recycleur d'eau : clone de la batterie de piles à combustible (pièce radiale).
//    Récupère 80 % de l'eau de 3 Kerbals contre 0,15 électricité/s.
+PART[FuelCellArray]:FOR[SanteKerbal]
{
	@name = SanteKerbal_Recycleur
	@title = Recycleur d'eau SK-R3
	@manufacturer = NoireTulipe (c) Corporation
	@description = Filtre, distille et purifie l'eau usée de l'équipage. Récupère 80 % de l'eau de trois Kerbals. On évite de demander d'où elle vient.
	@tags = santekerbal eau recyclage recycleur water recycler
	@category = Utility
	@TechRequired = survivability
	@entryCost = 3000
	@cost = 1200
	@mass = 0.15

	!MODULE[ModuleResourceConverter],* {}
	!RESOURCE[ElectricCharge] {}

	MODULE
	{
		name = ModuleSKRecycler
		kerbalsServed = 3
		recycleRatio = 0.8
		ecPerSecond = 0.15
	}
}

// 4) Serre : clone du Convert-O-Tron 125 (1,25 m).
//    Produit 2 nourriture par jour (de quoi nourrir 2 Kerbals) avec 2 eau par jour et 0,5 électricité/s.
+PART[MiniISRU]:FOR[SanteKerbal]
{
	@name = SanteKerbal_Serre
	@title = Serre hydroponique SK-G2
	@manufacturer = NoireTulipe (c) Corporation
	@description = Des rangées de laitues spatiales sous lumière artificielle. Nourrit deux Kerbals avec de l'eau et beaucoup d'électricité. Ne pas confondre les engrais avec la nourriture.
	@tags = santekerbal nourriture serre hydroponique food greenhouse
	@category = Utility
	@TechRequired = scienceTech
	@entryCost = 8000
	@cost = 4000
	@mass = 1.0

	!MODULE[ModuleResourceConverter],* {}
	!MODULE[ModuleCoreHeat] {}
	!MODULE[ModuleOverheatDisplay] {}

	MODULE
	{
		name = ModuleSKGreenhouse
		foodPerDay = 2
		waterPerFood = 1
		ecPerSecond = 0.5
	}

	// Petite réserve tampon pour stocker les récoltes
	RESOURCE
	{
		name = SanteKerbal_Nourriture
		amount = 0
		maxAmount = 30
	}
	RESOURCE
	{
		name = SanteKerbal_Eau
		amount = 30
		maxAmount = 30
	}
}

// 5) Caisson d'hibernation : clone de la cabine Mk1 (1,25 m, 2 places, avec intérieur).
//    Ses occupants peuvent être endormis (clic droit ou fenêtre SantéKerbal) : ils ne mangent
//    ni ne boivent mais consomment de l'électricité (réglages : SanteKerbal.cfg, cryo...).
+PART[MK1CrewCabin]:FOR[SanteKerbal]
{
	@name = SanteKerbal_Caisson
	@title = Caisson d'hibernation SK-H2
	@manufacturer = NoireTulipe (c) Corporation
	@description = Deux couchettes réfrigérées pour les très longs voyages. Le Kerbal dort, ne mange pas, ne boit pas et ne se plaint pas. Le réveil est pâteux. Ne pas débrancher.
	@tags = santekerbal hibernation cryo caisson sommeil sleep cryogenic
	@category = Utility
	@TechRequired = scienceTech
	@entryCost = 10000
	@cost = 6000
	@mass = 1.4

	MODULE
	{
		name = ModuleSKCryoPod
	}
}
